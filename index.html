<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Child's Wall Textures Presentation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; } 
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8); 
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        const tex1 = textureLoader.load('1.jpg'); 
        const tex2 = textureLoader.load('2.jpg');
        const tex3 = textureLoader.load('3.jpg');
        const tex4 = textureLoader.load('4.jpg');

        const geometry = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        
        const materials = [
            new THREE.MeshStandardMaterial({ map: tex1 }), 
            new THREE.MeshStandardMaterial({ map: tex2 }), 
            new THREE.MeshStandardMaterial({ color: 0xffffff }), 
            new THREE.MeshStandardMaterial({ color: 0x8B4513 }), 
            new THREE.MeshStandardMaterial({ map: tex3 }), 
            new THREE.MeshStandardMaterial({ map: tex4 })  
        ];

        const cube = new THREE.Mesh(geometry, materials);
        scene.add(cube);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        function animate() {
            requestAnimationFrame(animate);

            cube.rotation.y -= 0.005; 

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        animate();
    </script>
</body>
</html>
